name: Android Companion APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-companion.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android-companion
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: marathon-hq-companion-debug-apk
          path: android-companion/app/build/outputs/apk/debug/*.apk
